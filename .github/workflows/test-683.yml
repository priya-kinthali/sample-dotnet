name: Test global.json Creation on Windows

on:
  push:
    branches:
      - test-588
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        # os: [windows-latest, ubuntu-latest, macos-latest, macos-14, macos-26]
        os: [self-hosted]
        dotnet: [ '7.0.x', '8.0.x', '9.0.x', '10.0.x' ]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    name: Setup dotnet ${{ matrix.dotnet }} on ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install PowerShell Core (pwsh)
        if: runner.os == 'Windows'
        run: |
          if (-not (Get-Command pwsh -ErrorAction SilentlyContinue)) {
            # Download latest MSI
            $url = 'https://github.com/PowerShell/PowerShell/releases/latest/download/PowerShell-7.4.0-win-x64.msi'
            $msi = "$env:TEMP\pwsh.msi"
            Invoke-WebRequest -Uri $url -OutFile $msi
            Start-Process msiexec.exe -ArgumentList "/i $msi /quiet /norestart" -Wait
          }
        shell: powershell
      - name: Setup dotnet
        uses: actions/setup-dotnet@v5
        id: stepid
        with:
          dotnet-version: ${{ matrix.dotnet }}
      - name: Create temporary global.json
        run: |
          echo '{"sdk":{"version": "${{ steps.stepid.outputs.dotnet-version }}"}}' > ./global.json
        shell: pwsh
      - name: Show generated global.json content (Windows)
        if: runner.os == 'Windows'
        run: type global.json
      - name: Show generated global.json content (Unix)
        if: runner.os != 'Windows'
        run: cat global.json
      - name: Dotnet Info
        run: dotnet --info
