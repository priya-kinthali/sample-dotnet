name: check wget
on:
  push:
    branches:
      - test-588
  workflow_dispatch:

jobs:
  Architecture:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
            os: [macos-latest, ubuntu-latest, windows-latest]
            
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Clear dotnet cache
        if: runner.os != 'Windows'
        run: rm -rf $HOME/.dotnet
      - name: Clear dotnet cache (Windows)
        if: runner.os == 'Windows'
        run: Remove-Item -Recurse -Force $env:USERPROFILE\.dotnet
        shell: pwsh
      - uses: actions/setup-dotnet@v5
        with:
         dotnet-version: '*'
      - run: dotnet --info

