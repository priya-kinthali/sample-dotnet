name: check dotnet latest
on:
  push:
    branches:
      - test-588
  workflow_dispatch:

jobs:
  Architecture:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
            # os: [macos-latest, ubuntu-latest, windows-latest, windows-11-arm, macos-15-intel, ubuntu-24.04-arm]
            os: [ubuntu-latest]

            
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      # - name: Clear dotnet cache
      #   if: runner.os != 'Windows'
      #   run: rm -rf $HOME/.dotnet
      # - name: Clear dotnet cache (Windows)
      #   if: runner.os == 'Windows'
      #   run: Remove-Item -Recurse -Force $env:USERPROFILE\.dotnet
      #   shell: pwsh
      # - uses: actions/setup-dotnet@v5
      # - uses: mahabaleshwars/setup-dotnet@feature/497-dotnet-version-latest-keyword
      #   with:
      #     # dotnet-version: '11'
      #     # global-json-file: 'csharp/global.jsonn'
      #     dotnet-version: 'latest'
      #     dotnet-channel: lts
      #     # dotnet-quality: 'ga'
      - name: Install .NET SDK 11 (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o dotnet-install.sh
          chmod +x dotnet-install.sh
          ./dotnet-install.sh --version 11.0.100 --install-dir "$HOME/.dotnet"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"
      - run: dotnet --info

