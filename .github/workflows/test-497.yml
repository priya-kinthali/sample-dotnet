name: check dotnet latest
on:
  push:
    branches:
      - test-588
  workflow_dispatch:

jobs:
  Architecture:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
            # os: [macos-latest, ubuntu-latest, windows-latest, windows-11-arm, macos-15-intel, ubuntu-24.04-arm]
            os: [ubuntu-latest]

            
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      # - name: Clear dotnet cache
      #   if: runner.os != 'Windows'
      #   run: rm -rf $HOME/.dotnet
      # - name: Clear dotnet cache (Windows)
      #   if: runner.os == 'Windows'
      #   run: Remove-Item -Recurse -Force $env:USERPROFILE\.dotnet
      #   shell: pwsh
      # - uses: actions/setup-dotnet@v5
      # - uses: mahabaleshwars/setup-dotnet@feature/497-dotnet-version-latest-keyword
      #   with:
      #     # dotnet-version: '11'
      #     # global-json-file: 'csharp/global.jsonn'
      #     dotnet-version: 'latest'
      #     dotnet-channel: lts
      #     # dotnet-quality: 'ga'
      - name: Install .NET 6 on x64
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh | bash /dev/stdin --runtime dotnet --version 11.0.0-preview.2.26159.112 --architecture x64 --install-dir $HOME/.dotnet-x64

      - run: dotnet --info

