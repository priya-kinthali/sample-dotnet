  # ─── allowPrerelease: no sdk.version, just allowPrerelease ───────────
  # Per docs: "If a global.json file is found that doesn't specify an SDK version
  # but it specifies an allowPrerelease value, the highest installed SDK version
  # is used (equivalent to setting rollForward to latestMajor)."
  test-allowprerelease-no-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Write global.json (allowPrerelease only, no sdk.version)
        run: |
          echo '{"sdk":{"allowPrerelease":true}}' > global.json
      - name: Setup dotnet
        uses: priyagupta108/setup-dotnet@validate-global-json-sdk-version
        with:
          global-json-file: global.json
      - name: Verify some SDK was installed (latest available)
        shell: pwsh
        run: |
          $v = dotnet --version
          Write-Host "Installed SDK version: $v"
          if ($v -notmatch "^\d+\.\d+\.\d+") { throw "No valid SDK installed" }

  test-allowprerelease-false-no-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Write global.json (allowPrerelease false, no sdk.version)
        run: |
          echo '{"sdk":{"allowPrerelease":false}}' > global.json
      - name: Setup dotnet
        uses: priyagupta108/setup-dotnet@validate-global-json-sdk-version
        with:
          global-json-file: global.json
      - name: Verify a stable SDK was installed
        shell: pwsh
        run: |
          $v = dotnet --version
          Write-Host "Installed SDK version: $v"
          # Should NOT contain prerelease suffix (no dash after version)
          if ($v -match "^\d+\.\d+\.\d+-") { throw "Expected stable version, got prerelease: $v" }

  # ─── allowPrerelease with sdk.version and rollForward ────────────────
  # Per docs: "Whether prerelease versions are considered and what's the default
  # behavior when allowPrerelease isn't set is described in the allowPrerelease section."
  test-allowprerelease-true-with-version-and-rollforward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Write global.json (allowPrerelease true + version + rollForward)
        run: |
          echo '{"sdk":{"version":"10.0.100","rollForward":"latestFeature","allowPrerelease":true}}' > global.json
      - name: Setup dotnet
        uses: priyagupta108/setup-dotnet@validate-global-json-sdk-version
        with:
          global-json-file: global.json
      - name: Verify SDK 10.0.x installed (may include prerelease)
        shell: pwsh
        run: |
          $v = dotnet --version
          Write-Host "Installed SDK version: $v"
          if ($v -notmatch "^10\.0\.") { throw "Expected 10.0.x, got $v" }

  test-allowprerelease-false-with-version-and-rollforward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Write global.json (allowPrerelease false + version + rollForward)
        run: |
          echo '{"sdk":{"version":"10.0.100","rollForward":"latestPatch","allowPrerelease":false}}' > global.json
      - name: Setup dotnet
        uses: priyagupta108/setup-dotnet@validate-global-json-sdk-version
        with:
          global-json-file: global.json
      - name: Verify stable SDK in 10.0.1xx band installed
        shell: pwsh
        run: |
          $v = dotnet --version
          Write-Host "Installed SDK version: $v"
          if ($v -notmatch "^10\.0\.1\d{2}$") { throw "Expected stable 10.0.1xx, got $v" }

  # ─── Default rollForward (patch): version set, no rollForward field ──
  # Per docs: "If no rollForward value is set, it uses patch as the default
  # rollForward policy."
  test-default-rollforward-patch-behavior:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Write global.json (version only, no rollForward)
        run: |
          echo '{"sdk":{"version":"10.0.101"}}' > global.json
      - name: Setup dotnet
        uses: priyagupta108/setup-dotnet@validate-global-json-sdk-version
        with:
          global-json-file: global.json
      - name: Verify exact version or patch-compatible installed
        shell: pwsh
        run: |
          $v = dotnet --version
          Write-Host "Installed SDK version: $v"
          # With default 'patch' policy, the action passes version through as-is
          if ($v -ne "10.0.101") { throw "Expected exact 10.0.101 (no rollForward), got $v" }

  # ─── Non-latest rollForward values (patch, feature, minor, major, disable) ─
  # These are valid rollForward values per MS docs but the action's switch only
  # handles latest* variants. The version passes through as-is for CLI resolution.
  test-rollforward-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Write global.json (rollForward = patch)
        run: |
          echo '{"sdk":{"version":"10.0.101","rollForward":"patch"}}' > global.json
      - name: Setup dotnet
        uses: priyagupta108/setup-dotnet@validate-global-json-sdk-version
        with:
          global-json-file: global.json
      - name: Verify SDK installed (version passes through)
        shell: pwsh
        run: |
          $v = dotnet --version
          Write-Host "Installed SDK version: $v"
          # 'patch' rollForward: action passes full version, installs exact or patch-compatible
          if ($v -notmatch "^10\.0\.1\d{2}") { throw "Expected 10.0.1xx band, got $v" }

  test-rollforward-feature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Write global.json (rollForward = feature)
        run: |
          echo '{"sdk":{"version":"10.0.100","rollForward":"feature"}}' > global.json
      - name: Setup dotnet
        uses: priyagupta108/setup-dotnet@validate-global-json-sdk-version
        with:
          global-json-file: global.json
      - name: Verify SDK installed
        shell: pwsh
        run: |
          $v = dotnet --version
          Write-Host "Installed SDK version: $v"
          if ($v -notmatch "^10\.0\.") { throw "Expected 10.0.x, got $v" }

  test-rollforward-disable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Write global.json (rollForward = disable)
        run: |
          echo '{"sdk":{"version":"10.0.101","rollForward":"disable"}}' > global.json
      - name: Setup dotnet
        uses: priyagupta108/setup-dotnet@validate-global-json-sdk-version
        with:
          global-json-file: global.json
      - name: Verify exact version installed
        shell: pwsh
        run: |
          $v = dotnet --version
          Write-Host "Installed SDK version: $v"
          # 'disable' means only exact match - action passes version through as-is
          if ($v -ne "10.0.101") { throw "Expected exact 10.0.101, got $v" }

  # ─── EDGE CASE: Empty sdk object ────────────────────────────────────
  test-empty-sdk-object:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Write global.json (empty sdk object)
        run: |
          echo '{"sdk":{}}' > global.json
      - name: Setup dotnet
        uses: priyagupta108/setup-dotnet@validate-global-json-sdk-version
        with:
          global-json-file: global.json
          dotnet-version: '10.0'
      - name: Verify dotnet installed via dotnet-version input
        shell: pwsh
        run: |
          $v = dotnet --version
          Write-Host "Installed SDK version: $v"
          if ($v -notmatch "^10\.0\.") { throw "Expected 10.0.x, got $v" }

  # ─── EDGE CASE: Boundary patch value (exactly 100) ──────────────────
  test-boundary-patch-100:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Write global.json (minimum valid patch = 100)
        run: |
          echo '{"sdk":{"version":"10.0.100","rollForward":"latestPatch"}}' > global.json
      - name: Setup dotnet
        uses: priyagupta108/setup-dotnet@validate-global-json-sdk-version
        with:
          global-json-file: global.json
      - name: Verify SDK installed in 10.0.1xx band
        shell: pwsh
        run: |
          $v = dotnet --version
          Write-Host "Installed SDK version: $v"
          if ($v -notmatch "^10\.0\.1\d{2}") { throw "Expected 10.0.1xx, got $v" }

  # ─── EDGE CASE: Four-digit patch (valid per regex \d{2,}) ───────────
  test-four-digit-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Write global.json (4-digit patch like 1000 - hypothetical)
        run: |
          echo '{"sdk":{"version":"10.0.1000","rollForward":"latestPatch"}}' > global.json
      - name: Setup dotnet (expect failure - version doesn't exist)
        id: setup
        uses: priyagupta108/setup-dotnet@validate-global-json-sdk-version
        with:
          global-json-file: global.json
        continue-on-error: true
      - name: Verify validation passes but install may fail
        run: |
          echo "Outcome: ${{ steps.setup.outcome }}"
          echo "ℹ️ Validation passed (4-digit patch is regex-valid), install failed because version doesn't exist"

  # ─── EDGE CASE: Prerelease + allowPrerelease + rollForward ──────────
  # Ensures prerelease bypass still works when allowPrerelease is also set
  test-prerelease-with-allowprerelease-and-rollforward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Write global.json (prerelease version + allowPrerelease + rollForward)
        run: |
          echo '{"sdk":{"version":"10.0.100-preview.7.25380.108","rollForward":"latestPatch","allowPrerelease":true}}' > global.json
      - name: Setup dotnet
        uses: priyagupta108/setup-dotnet@validate-global-json-sdk-version
        with:
          global-json-file: global.json
      - name: Verify exact prerelease returned (rollForward bypassed)
        shell: pwsh
        run: |
          $v = dotnet --version
          Write-Host "Installed SDK version: $v"
          if ($v -ne "10.0.100-preview.7.25380.108") { throw "Expected exact prerelease, got $v" }

  # ─── ERROR: rollForward with only major.minor (no patch) ────────────
  test-invalid-majorminor-with-rollforward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Write global.json (major.minor only + rollForward)
        run: |
          echo '{"sdk":{"version":"10.0","rollForward":"latestFeature"}}' > global.json
      - name: Setup dotnet (expect failure)
        id: setup
        uses: priyagupta108/setup-dotnet@validate-global-json-sdk-version
        with:
          global-json-file: global.json
        continue-on-error: true
      - name: Verify failure
        if: steps.setup.outcome == 'failure'
        run: echo "✅ Correctly rejected major.minor-only version with rollForward"
      - name: Fail if unexpectedly succeeded
        if: steps.setup.outcome == 'success'
        run: |
          echo "❌ Should have failed for version 10.0 with rollForward"
          exit 1

  # ─── ERROR: rollForward with wildcard version ───────────────────────
  test-invalid-wildcard-with-rollforward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Write global.json (wildcard version + rollForward)
        run: |
          echo '{"sdk":{"version":"10.0.x","rollForward":"latestPatch"}}' > global.json
      - name: Setup dotnet (expect failure)
        id: setup
        uses: priyagupta108/setup-dotnet@validate-global-json-sdk-version
        with:
          global-json-file: global.json
        continue-on-error: true
      - name: Verify failure
        if: steps.setup.outcome == 'failure'
        run: echo "✅ Correctly rejected wildcard version with rollForward"
      - name: Fail if unexpectedly succeeded
        if: steps.setup.outcome == 'success'
        run: |
          echo "❌ Should have failed for version 10.0.x with rollForward"
          exit 1