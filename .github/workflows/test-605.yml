name: Test msbuild problem matcher

on:
  push:
    branches:
      - test-588
  workflow_dispatch:

jobs:
  test-matcher:
    runs-on: ubuntu-latest
    steps:
      # 1. Create the exact matcher from PR #605 (.github/msbuild.json)
      - name: Create msbuild.json matcher
        run: |
          mkdir -p .github
          cat > .github/msbuild.json << 'EOF'
          {
              "problemMatcher": [
                  {
                      "owner": "msbuild",
                      "pattern": [
                          {
                              "regexp": "^([^\\s].*)\\s+:\\s+(error|warning)\\s+([a-zA-Z]+(?<!MSB)\\d+):\\s*(.*?)\\s+\\[(.*?)\\]$",
                              "file": 1,
                              "severity": 2,
                              "code": 3,
                              "message": 4,
                              "fromPath": 5
                          }
                      ]
                  }
              ]
          }
          EOF

      # 2. Register the matcher
      - name: Register matcher
        run: echo "::add-matcher::.github/msbuild.json"

      # 3a. SHOULD MATCH — NuGet audit warning
      - name: Case 1 - warning (should annotate)
        run: |
          echo "/repo/sample.csproj : warning NU1904: Package 'System.Text.Encodings.Web' 4.7.0 has a known critical severity vulnerability, https://github.com/advisories/GHSA-ghhp-997w-qr28 [/repo/sample.csproj]"

      # 3b. SHOULD MATCH — NuGet audit error
      - name: Case 2 - error (should annotate)
        run: |
          echo "/repo/sample.csproj : error NU1904: Package 'System.Text.Encodings.Web' 4.7.0 has a known critical severity vulnerability, https://github.com/advisories/GHSA-ghhp-997w-qr28 [/repo/sample.csproj]"

      # 3c. SHOULD MATCH — other NU audit codes (NU1900–NU1905 range)
      - name: Case 3 - other NU codes (should annotate)
        run: |
          echo "/repo/sample.csproj : warning NU1901: Package 'Foo' 1.0.0 has a known low severity vulnerability [/repo/sample.csproj]"
          echo "/repo/sample.csproj : error NU1903: Package 'Bar' 2.0.0 has a known high severity vulnerability [/repo/sample.csproj]"

      # 3d. SHOULD NOT MATCH — MSB codes are excluded via (?<!MSB)
      - name: Case 4 - MSB code (should NOT annotate)
        run: |
          echo "/repo/sample.csproj : error MSB4018: The build task failed unexpectedly [/repo/sample.csproj]"

      # 3e. SHOULD NOT MATCH — compiler CS error with line/column (no ' : ' shape)
      - name: Case 5 - CS compiler line (should NOT annotate by msbuild matcher)
        run: |
          echo "/repo/Program.cs(12,5): error CS1002: ; expected [/repo/sample.csproj]"

      # 3f. SHOULD NOT MATCH — informational line without [path] suffix
      - name: Case 6 - no bracket path (should NOT annotate)
        run: |
          echo "/repo/sample.csproj : warning NU1701: Package restored using a different framework"

      - name: Cleanup / remove matcher
        if: always()
        run: echo "::remove-matcher owner=msbuild::"