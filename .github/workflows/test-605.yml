name: Test msbuild problem matcher

on:
  # push:
  #   branches:
  #     - test-588
  workflow_dispatch:

# 
jobs:
  test-matchers:
    runs-on: ubuntu-latest
    steps:
      # -------------------------------------------------------------------
      # 1. Create BOTH matchers exactly as they exist / are proposed
      # -------------------------------------------------------------------
      - name: Create csc.json (existing matcher)
        run: |
          mkdir -p .github
          cat > .github/csc.json << 'EOF'
          {
              "problemMatcher": [
                  {
                      "owner": "csc",
                      "pattern": [
                          {
                              "regexp": "^\\s*(?:\\d+>\\s*)?([^\\s].*)\\((\\d+)(?:,(\\d+))?(?:,\\d+)*\\):\\s+(error|warning)\\s+([a-zA-Z]+(?<!MSB)\\d*):\\s*(.*?)\\s+\\[(.*?)\\]$",
                              "file": 1,
                              "line": 2,
                              "column": 3,
                              "severity": 4,
                              "code": 5,
                              "message": 6,
                              "fromPath": 7
                          }
                      ]
                  }
              ]
          }
          EOF

      - name: Create msbuild.json (PR #605 broad matcher)
        run: |
          cat > .github/msbuild.json << 'EOF'
          {
              "problemMatcher": [
                  {
                      "owner": "msbuild",
                      "pattern": [
                          {
                              "regexp": "^([^\\s].*)\\s+:\\s+(error|warning)\\s+([a-zA-Z]+(?<!MSB)\\d+):\\s*(.*?)\\s+\\[(.*?)\\]$",
                              "file": 1,
                              "severity": 2,
                              "code": 3,
                              "message": 4,
                              "fromPath": 5
                          }
                      ]
                  }
              ]
          }
          EOF

      # -------------------------------------------------------------------
      # 2. Register BOTH matchers (simultaneously, like the PR does)
      # -------------------------------------------------------------------
      - name: Register both matchers
        run: |
          echo "::add-matcher::.github/csc.json"
          echo "::add-matcher::.github/msbuild.json"

      # ===================================================================
      # GROUP A — Same code in BOTH line formats (proves NO overlap)
      # ===================================================================

      - name: A1 - CA1822 in (line,col) form -> CSC ONLY
        run: |
          echo "/repo/Program.cs(12,5): warning CA1822: Member can be marked static [/repo/app.csproj]"

      - name: A2 - CA1822 in ' :' form -> MSBUILD ONLY
        run: |
          echo "/repo/app.csproj : warning CA1822: Member can be marked static [/repo/app.csproj]"

      - name: A3 - CS1002 in (line,col) form -> CSC ONLY
        run: |
          echo "/repo/Program.cs(12,5): error CS1002: ; expected [/repo/app.csproj]"

      - name: A4 - CS1002 in ' :' form -> MSBUILD ONLY
        run: |
          echo "/repo/app.csproj : error CS1002: ; expected [/repo/app.csproj]"

      # ===================================================================
      # GROUP B — NuGet audit (the actual #603 target) -> MSBUILD ONLY
      # (csc cannot match: no (line,col) token)
      # ===================================================================

      - name: B1 - NU1901 warning -> MSBUILD ONLY
        run: |
          echo "/repo/app.csproj : warning NU1901: Vulnerability found in package Newtonsoft.Json 13.0.1 [/repo/app.csproj]"

      - name: B2 - NU1904 error -> MSBUILD ONLY
        run: |
          echo "/repo/app.csproj : error NU1904: Known critical severity vulnerability in System.Text.Encodings.Web 4.7.0 [/repo/app.csproj]"

      # ===================================================================
      # GROUP C — BROAD-only extras (what 'broad' adds beyond narrow NU)
      # These match msbuild (broad) but would NOT match a narrow NU\d+ regex
      # ===================================================================

      - name: C1 - NETSDK warning -> MSBUILD (broad) matches
        run: |
          echo "/repo/app.csproj : warning NETSDK1045: The current SDK does not support the target framework [/repo/app.csproj]"

      - name: C2 - IL trimming warning -> MSBUILD (broad) matches
        run: |
          echo "/repo/app.csproj : warning IL2026: Trimming may remove members [/repo/app.csproj]"

      # ===================================================================
      # GROUP D — MSB codes -> should match NEITHER (the (?<!MSB) guard)
      # ===================================================================

      - name: D1 - MSB in ' :' form -> should NOT annotate (msbuild excludes MSB)
        run: |
          echo "/repo/app.csproj : error MSB4018: The build task failed unexpectedly [/repo/app.csproj]"

      - name: D2 - MSB in (line,col) form -> should NOT annotate (csc excludes MSB)
        run: |
          echo "/repo/app.targets(5,1): error MSB4018: The build task failed unexpectedly [/repo/app.csproj]"

      # ===================================================================
      # GROUP E — Negative shapes -> should match NEITHER
      # ===================================================================

      - name: E1 - No trailing [project] bracket -> should NOT annotate
        run: |
          echo "/repo/app.csproj : warning NU1701: Package restored using a different framework"

      - name: E2 - Plain info line -> should NOT annotate
        run: |
          echo "Restored /repo/app.csproj (in 1.2 sec)."

      - name: Cleanup matchers
        if: always()
        run: |
          echo "::remove-matcher owner=csc::"
          echo "::remove-matcher owner=msbuild::"