name: check cross arch
on:
  push:
    branches:
      - test-588
  workflow_dispatch:

jobs:

   Crossarchitecture:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
            os: [macos-latest, ubuntu-latest, windows-latest, ubuntu-24.04-arm, windows-11-arm]
            arch: [x64, x86, arm64, amd64, arm, s390x, ppc64le, riscv64]           

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - run: |
          dotnet --info
      - uses:  priya-kinthali/setup-dotnet@test-524
        with:
         Architecture : ${{ matrix.arch }}
         dotnet-version: | 
                  9.0.308
                  10.0.101     
      - run: dotnet --info