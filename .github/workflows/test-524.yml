name: check cross arch with info
on:
  # push:
  #   branches:
  #     - test-588
  workflow_dispatch:

jobs:

  default:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
            os: [macos-15-intel, macos-latest, ubuntu-latest, windows-latest, ubuntu-24.04-arm, windows-11-arm]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - run: |
          dotnet --info
      - name: Set DOTNET_INSTALL_DIR
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: echo "DOTNET_INSTALL_DIR=${{ runner.temp }}/.dotnet" >> $GITHUB_ENV
      - name: Set DOTNET_INSTALL_DIR
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "DOTNET_INSTALL_DIR=$env:USERPROFILE\.dotnet" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append 
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.102'
          # cache: true
          # cache-dependency-path: src/Library/packages.lock.json
        #  dotnet-quality: 'preview'
        # global-json-file: csharp/global.json
        #  dotnet-version: | 
        #           9.0.308
        #           10.0.101     
      - name: Echo DOTNET_INSTALL_DIR and DOTNET_ROOT (Linux/macOS)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: |
          echo "DOTNET_INSTALL_DIR=$DOTNET_INSTALL_DIR"
          echo "DOTNET_ROOT=$DOTNET_ROOT"

      - name: Echo DOTNET_INSTALL_DIR and DOTNET_ROOT (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "DOTNET_INSTALL_DIR=$env:DOTNET_INSTALL_DIR"
          Write-Host "DOTNET_ROOT=$env:DOTNET_ROOT"
      - run: dotnet --info
      - run: dotnet restore --locked-mode
  
  crossarchitecture:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
            os: [macos-15-intel, macos-latest, ubuntu-latest, windows-latest, ubuntu-24.04-arm, windows-11-arm]
            arch: [x64, x86, arm64]           

    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - run: |
          dotnet --info
      - name: Set DOTNET_INSTALL_DIR
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: echo "DOTNET_INSTALL_DIR=${{ runner.temp }}/.dotnet" >> $GITHUB_ENV
      - name: Set DOTNET_INSTALL_DIR
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "DOTNET_INSTALL_DIR=$env:USERPROFILE\.dotnet" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append 
      - uses:  priya-kinthali/setup-dotnet@test-524
        with:
         architecture : ${{ matrix.arch }}
         dotnet-version: '10.0.102'
        #  cache: true
        #  cache-dependency-path: src/Library/packages.lock.json
        #  dotnet-quality: 'preview'
        #  global-json-file: csharp/global.json
        #  dotnet-version: | 
        #           9.0.308
        #           10.0.101     
      - name: Echo DOTNET_INSTALL_DIR and DOTNET_ROOT (Linux/macOS)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: |
          echo "DOTNET_INSTALL_DIR=$DOTNET_INSTALL_DIR"
          echo "DOTNET_ROOT=$DOTNET_ROOT"

      - name: Echo DOTNET_INSTALL_DIR and DOTNET_ROOT (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "DOTNET_INSTALL_DIR=$env:DOTNET_INSTALL_DIR"
          Write-Host "DOTNET_ROOT=$env:DOTNET_ROOT"
      - run: dotnet --info
      - run: dotnet restore --locked-mode