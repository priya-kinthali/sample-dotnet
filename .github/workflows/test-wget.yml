name: check wget
on:
  push:
    branches:
      - test-588
  workflow_dispatch:

jobs:
  test-proxy:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/devcontainers/dotnet:latest
      options: --dns 127.0.0.1
    services:
      squid-proxy:
        image: ubuntu/squid:latest
        ports:
          - 3128:3128
    env:
      https_proxy: http://squid-proxy:3128
      http_proxy: http://squid-proxy:3128
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Check if PowerShell is installed
        run: |
          if command -v pwsh >/dev/null 2>&1; then
            echo "PowerShell is already installed"
            pwsh --version
          else
            echo "PowerShell is NOT installed"
          fi
      # - name: Install curl
      #   run: apt-get update && apt-get install -y curl
      # - name: Install Powershell
      #   run: |
      #     set -eu
      #     apt-get update
      #     apt-get install -y wget apt-transport-https software-properties-common
      #     TEMP_DIR="$(mktemp -d)"
      #     wget -q -O "${TEMP_DIR}/packages-microsoft-prod.deb" "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
      #     dpkg-deb --info "${TEMP_DIR}/packages-microsoft-prod.deb" >/dev/null
      #     dpkg -i "${TEMP_DIR}/packages-microsoft-prod.deb"
      #     rm -rf "${TEMP_DIR}"
      #     apt-get update
      #     apt-get install -y powershell
      - name: Setup dotnet 10.0
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0
          source-url: https://api.nuget.org/v3/index.json
        env:
          NUGET_AUTH_TOKEN: NOTATOKEN