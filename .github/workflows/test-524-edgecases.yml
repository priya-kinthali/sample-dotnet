name: test-setup-dotnet-architecture-validation

on:
  push:
    branches:
      - test-588
  workflow_dispatch:

jobs:
  arch-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup dotnet - architecture omitted (auto)
        uses: lmvysakh/setup-dotnet@support_architecture
        with:
          dotnet-version: 8.0.x

      - name: Setup dotnet - architecture whitespace (auto)
        uses: lmvysakh/setup-dotnet@support_architecture
        with:
          dotnet-version: 8.0.x
          architecture: "   "

      - name: Setup dotnet - architecture case normalization (X64)
        uses: lmvysakh/setup-dotnet@support_architecture
        with:
          dotnet-version: 8.0.x
          architecture: X64

      - name: Setup dotnet - invalid architecture should fail
        id: invalid
        continue-on-error: true
        uses: lmvysakh/setup-dotnet@support_architecture
        with:
          dotnet-version: 8.0.x
          architecture: xabc

      - name: Assert invalid architecture failed
        if: steps.invalid.outcome == 'success'
        run: |
          echo "Expected invalid architecture to fail but it succeeded."
          exit 1