name: test-setup-dotnet-architecture-validation

on:
  push:
    branches:
      - test-588
  workflow_dispatch:

jobs:
  arch-validation:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-15-intel, ubuntu-24.04-arm, windows-11-arm ]
    steps:
      - uses: actions/checkout@v6

      - name: Setup dotnet - architecture whitespace (auto)
        uses: lmvysakh/setup-dotnet@support_architecture
        with:
          dotnet-version: 8.0.x
          architecture: "   "
      - run: dotnet --info

